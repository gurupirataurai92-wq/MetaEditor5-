# SIMS AI — full stack on one VPS (dissertation §4.10).
# Usage:  SIMS_JWT_SECRET=$(openssl rand -hex 32) docker compose up -d
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sims
      POSTGRES_USER: sims
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sims-dev-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/rls.sql:/docker-entrypoint-initdb.d/zz-rls.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sims"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data

  api:
    build: ../backend
    environment:
      SIMS_DATABASE_URL: postgresql+psycopg2://sims:${POSTGRES_PASSWORD:-sims-dev-only}@db:5432/sims
      SIMS_JWT_SECRET: ${SIMS_JWT_SECRET:?set SIMS_JWT_SECRET}
      SIMS_CORS_ORIGINS: ${SIMS_CORS_ORIGINS:-*}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  web:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../web/dist:/usr/share/nginx/html:ro
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
