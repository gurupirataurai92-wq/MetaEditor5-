<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My deliveries · Haulr</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>"
    />
  </head>
  <body>
    <header class="site-header">
      <div class="wrap-wide">
        <a class="brand" href="index.html"><span class="brand-mark">H</span>Haulr</a>
        <nav class="nav" id="nav"></nav>
      </div>
    </header>

    <main class="app-main">
      <div class="wrap-wide">
        <div class="row-between" style="margin-bottom: 1.2rem">
          <div>
            <h1 style="font-size: 1.8rem; margin-bottom: 0.15rem" id="greeting">My deliveries</h1>
            <p class="muted" style="margin: 0">
              Every job you have posted, and the offers waiting on them.
            </p>
          </div>
          <div class="row">
            <span class="conn" id="conn"></span>
            <a href="request.html" class="btn btn-accent">+ New delivery</a>
          </div>
        </div>

        <div class="stat-grid" id="stats" style="margin-bottom: 1.4rem"></div>

        <div class="tabs">
          <button class="tab active" data-scope="active">In progress</button>
          <button class="tab" data-scope="history">History</button>
        </div>

        <div id="tripList" class="list">
          <div class="skeleton" style="height: 120px"></div>
          <div class="skeleton" style="height: 120px"></div>
        </div>
      </div>
    </main>

    <script src="js/app.js"></script>
    <script src="js/customer.js"></script>
  </body>
</html>
