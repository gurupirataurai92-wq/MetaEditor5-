<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="SIMS AI — offline-first, AI-augmented business management for Zimbabwean SMEs" />
    <!-- Installable app (PWA) — install on PC/Android, Add to Home Screen on tablet/phone -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f9d72" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SIMS AI" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>SIMS AI — Business Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register the service worker so the app is installable and works offline.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {})
        })
      }
    </script>
  </body>
</html>
