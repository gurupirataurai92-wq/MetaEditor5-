{% extends "base.html" %}
{% block title %}{{ 'Edit' if teacher else 'New' }} Teacher{% endblock %}
{% block content %}
{% set d = teacher if teacher else form %}
<div class="card" style="max-width:640px;">
  <h1>{{ 'Edit' if teacher else 'New' }} Teacher</h1>
  <form method="post">
    <div class="form-row">
      <label>First name</label>
      <input name="first_name" value="{{ d.first_name or '' }}" required>
    </div>
    <div class="form-row">
      <label>Last name</label>
      <input name="last_name" value="{{ d.last_name or '' }}" required>
    </div>
    {% if not teacher %}
    <div class="form-row">
      <label>Username</label>
      <input name="username" value="{{ form.username or '' }}" required>
    </div>
    <div class="form-row">
      <label>Email</label>
      <input name="email" type="email" value="{{ form.email or '' }}" required>
    </div>
    <div class="form-row">
      <label>Password</label>
      <input name="password" type="password" required>
    </div>
    {% endif %}
    <div class="form-row">
      <label>Department</label>
      <input name="department" value="{{ d.department or '' }}">
    </div>
    <div class="form-row">
      <label>Phone</label>
      <input name="phone" value="{{ d.phone or '' }}">
    </div>
    <button class="btn" type="submit">Save</button>
    <a class="btn btn-secondary" href="{{ url_for('teachers.index') }}">Cancel</a>
  </form>
</div>
{% endblock %}
