<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consultant God Mode</title>
<style>
:root {
  --bg: #0d1117;
  --bg-2: #131a23;
  --panel: #161f2a;
  --panel-2: #1c2733;
  --border: #263241;
  --text: #dbe4ee;
  --muted: #8496a9;
  --accent: #d4a72c;
  --accent-2: #f0c14b;
  --good: #3fb968;
  --warn: #e0a63a;
  --bad: #e05a4e;
  --info: #4a9edb;
  --radius: 10px;
  --font: "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "Cascadia Code", "Consolas", monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { font-family: var(--font); background: var(--bg); color: var(--text); font-size: 14px; }

.app { display: flex; min-height: 100vh; }

/* ---------- Sidebar ---------- */
.sidebar {
  width: 232px; flex-shrink: 0; background: var(--bg-2);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 18px 16px; border-bottom: 1px solid var(--border); }
.brand-mark {
  width: 38px; height: 38px; border-radius: 9px; flex-shrink: 0;
  background: linear-gradient(135deg, var(--accent), #8a6a12);
  color: #10141a; font-weight: 800; font-size: 15px;
  display: flex; align-items: center; justify-content: center;
}
.brand-name { font-weight: 700; letter-spacing: 2px; font-size: 13px; color: var(--accent-2); }
.brand-sub { font-size: 10.5px; color: var(--muted); }

#nav { padding: 10px 8px; flex: 1; }
#nav a {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; border-radius: 8px; cursor: pointer;
  color: var(--muted); text-decoration: none; margin-bottom: 2px;
  transition: background .12s, color .12s;
}
#nav a:hover { background: var(--panel-2); color: var(--text); }
#nav a.active { background: var(--panel-2); color: var(--accent-2); }
#nav .ico { width: 18px; text-align: center; font-size: 13px; }
.nav-group { font-size: 10px; letter-spacing: 1.5px; color: var(--muted); opacity: .7; padding: 14px 12px 4px; }
.sidebar-foot { padding: 12px; border-top: 1px solid var(--border); display: flex; gap: 8px; }

/* ---------- Main ---------- */
.main { flex: 1; padding: 26px 32px 60px; max-width: 1280px; }
.view-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
.view-head h1 { font-size: 22px; font-weight: 700; }
.view-head .sub { color: var(--muted); margin-top: 4px; font-size: 13px; }
.head-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- Cards / grids ---------- */
.grid { display: grid; gap: 14px; }
.grid-4 { grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.grid-3 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.grid-2 { grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); }

.card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; }
.card h3 { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 10px; letter-spacing: .4px; text-transform: uppercase; }

.stat { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
.stat .label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
.stat .value { font-size: 24px; font-weight: 700; margin-top: 6px; font-variant-numeric: tabular-nums; }
.stat .hint { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
.stat.good .value { color: var(--good); }
.stat.warn .value { color: var(--warn); }
.stat.bad .value { color: var(--bad); }
.stat.accent .value { color: var(--accent-2); }

/* ---------- Tables ---------- */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; padding: 8px 10px; color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid rgba(38,50,65,.55); vertical-align: top; }
tr:last-child td { border-bottom: none; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); font-style: italic; padding: 18px 10px; text-align: center; }

/* ---------- Badges ---------- */
.badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; }
.b-green { background: rgba(63,185,104,.15); color: var(--good); }
.b-amber { background: rgba(224,166,58,.15); color: var(--warn); }
.b-red { background: rgba(224,90,78,.16); color: var(--bad); }
.b-blue { background: rgba(74,158,219,.15); color: var(--info); }
.b-grey { background: rgba(132,150,169,.15); color: var(--muted); }
.b-gold { background: rgba(212,167,44,.16); color: var(--accent-2); }

/* ---------- Buttons ---------- */
.btn {
  border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
  border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: filter .12s;
}
.btn:hover { filter: brightness(1.15); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #14100a; }
.btn-danger { background: transparent; border-color: rgba(224,90,78,.5); color: var(--bad); }
.btn-ghost { background: transparent; }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn-icon { padding: 3px 8px; font-size: 12px; background: transparent; }

/* ---------- Forms ---------- */
label { display: block; font-size: 11.5px; color: var(--muted); margin: 10px 0 4px; font-weight: 600; letter-spacing: .3px; }
input, select, textarea {
  width: 100%; background: var(--bg-2); border: 1px solid var(--border); color: var(--text);
  border-radius: 7px; padding: 8px 10px; font-size: 13px; font-family: var(--font);
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
textarea { resize: vertical; min-height: 64px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0 14px; }

/* ---------- Modal ---------- */
.modal-backdrop[hidden], .toast[hidden] { display: none; }
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(5,8,12,.7); backdrop-filter: blur(2px);
  display: flex; align-items: flex-start; justify-content: center; padding: 6vh 16px; z-index: 50; overflow-y: auto;
}
.modal {
  background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
  width: 100%; max-width: 560px; padding: 22px 24px 24px;
}
.modal h2 { font-size: 16px; margin-bottom: 6px; }
.modal .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

/* ---------- Toast ---------- */
.toast {
  position: fixed; bottom: 22px; right: 22px; z-index: 60;
  background: var(--panel-2); border: 1px solid var(--accent); color: var(--text);
  padding: 11px 18px; border-radius: 9px; font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,.4);
}

/* ---------- OODA ---------- */
.ooda-loop { border: 1px solid var(--border); border-radius: var(--radius); background: var(--panel); padding: 16px 18px; margin-bottom: 14px; }
.ooda-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.ooda-title { font-weight: 700; font-size: 15px; }
.ooda-stages { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.ooda-stage { background: var(--bg-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
.ooda-stage.current { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.ooda-stage.done { opacity: .75; border-color: rgba(63,185,104,.4); }
.ooda-stage h4 { font-size: 11px; letter-spacing: 1.2px; color: var(--accent-2); margin-bottom: 6px; }
.ooda-stage.done h4 { color: var(--good); }
.ooda-stage p { font-size: 12.5px; color: var(--text); white-space: pre-wrap; }
.ooda-stage .placeholder { color: var(--muted); font-style: italic; }
.ooda-foot { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
.cycle-chip { font-size: 11px; color: var(--muted); }

/* ---------- SWOT ---------- */
.swot-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.swot-cell { border-radius: 8px; padding: 10px 12px; border: 1px solid var(--border); background: var(--bg-2); min-height: 90px; }
.swot-cell h4 { font-size: 11px; letter-spacing: 1px; margin-bottom: 6px; }
.swot-s h4 { color: var(--good); } .swot-w h4 { color: var(--bad); }
.swot-o h4 { color: var(--info); } .swot-t h4 { color: var(--warn); }
.swot-cell ul { list-style: none; }
.swot-cell li { font-size: 12.5px; padding: 2px 0; }

/* ---------- Risk matrix ---------- */
.risk-score { font-weight: 700; font-variant-numeric: tabular-nums; }

/* ---------- Report ---------- */
.report-line { display: flex; justify-content: space-between; padding: 5px 0; font-size: 13px; }
.report-line.total { border-top: 1px solid var(--border); margin-top: 6px; padding-top: 8px; font-weight: 700; }
.report-line .amt { font-variant-numeric: tabular-nums; }
.report-section { margin-bottom: 14px; }
.report-section h4 { font-size: 12px; color: var(--accent-2); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }

/* ---------- Command palette ---------- */
.kbd-hint { padding: 8px 14px 14px; font-size: 11px; color: var(--muted); }
kbd { background: var(--panel-2); border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; padding: 1px 5px; font-family: var(--mono); font-size: 10px; }
.cmdk-backdrop[hidden] { display: none; }
.cmdk-backdrop { position: fixed; inset: 0; background: rgba(5,8,12,.72); z-index: 70; display: flex; justify-content: center; align-items: flex-start; padding: 12vh 16px; }
.cmdk { width: 100%; max-width: 620px; background: var(--panel); border: 1px solid var(--accent); border-radius: 12px; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,.55); }
.cmdk input { border: none; border-bottom: 1px solid var(--border); border-radius: 0; padding: 15px 18px; font-size: 15px; background: var(--panel); }
.cmdk input:focus { border-color: var(--border); }
.cmdk-results { max-height: 46vh; overflow-y: auto; padding: 6px; }
.cmdk-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 7px; cursor: pointer; font-size: 13.5px; }
.cmdk-item.sel, .cmdk-item:hover { background: var(--panel-2); }
.cmdk-item .tag { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); background: var(--bg-2); border: 1px solid var(--border); border-radius: 4px; padding: 2px 6px; flex-shrink: 0; min-width: 66px; text-align: center; }
.cmdk-item .sub { color: var(--muted); font-size: 12px; margin-left: auto; }
.cmdk-empty { padding: 18px; color: var(--muted); font-style: italic; text-align: center; }

/* ---------- Cash-flow chart ---------- */
.chart-legend { display: flex; gap: 18px; margin-bottom: 10px; font-size: 12px; color: var(--muted); }
.chart-legend .chip { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.cashflow-svg { width: 100%; height: auto; display: block; }
.cashflow-svg .grid { stroke: rgba(38,50,65,.6); stroke-width: 1; }
.cashflow-svg .axis-label { fill: var(--muted); font-size: 10px; font-family: var(--font); }
.cashflow-svg .bar { cursor: pointer; }
.cashflow-svg .bar:hover { filter: brightness(1.25); }
.chart-tip[hidden] { display: none; }
.chart-tip { position: fixed; z-index: 80; background: var(--panel-2); border: 1px solid var(--border); border-radius: 7px; padding: 7px 11px; font-size: 12px; pointer-events: none; box-shadow: 0 6px 18px rgba(0,0,0,.4); }
.chart-tip .t-val { font-weight: 700; font-variant-numeric: tabular-nums; }
details.chart-data summary { cursor: pointer; color: var(--muted); font-size: 12px; margin-top: 10px; }

/* ---------- Invoice paper preview ---------- */
.paper { background: #ffffff; color: #1c2530; border-radius: 8px; padding: 28px 30px; font-size: 13px; }
.paper h1 { font-size: 20px; letter-spacing: 2px; color: #1c2530; }
.paper .muted { color: #5a6b7d; }
.paper table { font-size: 12.5px; }
.paper th { color: #5a6b7d; border-bottom: 1px solid #d7dee6; }
.paper td { border-bottom: 1px solid #edf1f5; color: #1c2530; }
.paper .paper-head { display: flex; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
.paper .paper-total { text-align: right; font-size: 16px; font-weight: 700; margin-top: 14px; }
.paper .badge { border: 1px solid currentColor; background: transparent; }

/* ---------- Health score ---------- */
.health-ring { font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
.health-grade { font-size: 13px; letter-spacing: 2px; font-weight: 700; }

/* ---------- Print (invoice / report) ---------- */
@media print {
  body:has(.modal-backdrop:not([hidden])) .app,
  body:has(.modal-backdrop:not([hidden])) .toast,
  body:has(.modal-backdrop:not([hidden])) .chart-tip { display: none !important; }
  .modal-backdrop { position: static !important; padding: 0 !important; background: #fff !important; backdrop-filter: none !important; }
  .modal { max-width: 100% !important; border: none !important; background: #fff !important; color: #000; box-shadow: none !important; }
  .modal-actions, .no-print { display: none !important; }
  .paper { border-radius: 0; padding: 0; }
}

.mt { margin-top: 14px; }
.muted { color: var(--muted); }
.pos { color: var(--good); } .neg { color: var(--bad); }
.mono { font-family: var(--mono); }

@media (max-width: 860px) {
  .app { flex-direction: column; }
  .sidebar { width: 100%; height: auto; position: static; }
  .main { padding: 18px 14px 60px; }
  .form-row, .form-row-3 { grid-template-columns: 1fr; }
}

</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">GM</div>
      <div>
        <div class="brand-name">GOD MODE</div>
        <div class="brand-sub">Business Consultant OS</div>
      </div>
    </div>
    <nav id="nav">
      <a data-view="dashboard" class="active"><span class="ico">◈</span> Dashboard</a>
      <a data-view="ooda"><span class="ico">⟳</span> OODA Engine</a>
      <div class="nav-group">CORE PRACTICE</div>
      <a data-view="consulting"><span class="ico">◎</span> Consulting / CRM</a>
      <a data-view="auditing"><span class="ico">✓</span> Auditing</a>
      <a data-view="accounting"><span class="ico">Σ</span> Accounting</a>
      <a data-view="invoicing"><span class="ico">▤</span> Invoicing</a>
      <a data-view="microfinance"><span class="ico">₵</span> Microfinance</a>
      <div class="nav-group">EXTENDED PRACTICE</div>
      <a data-view="tax"><span class="ico">§</span> Tax &amp; Compliance</a>
      <a data-view="hr"><span class="ico">☰</span> HR &amp; Payroll</a>
      <a data-view="risk"><span class="ico">⚠</span> Risk Register</a>
      <a data-view="analysis"><span class="ico">%</span> Financial Analysis</a>
    </nav>
    <div class="sidebar-foot">
      <button class="btn btn-ghost btn-sm" data-action="export-data">Export</button>
      <button class="btn btn-ghost btn-sm" data-action="import-data">Import</button>
      <button class="btn btn-ghost btn-sm" data-action="currency">¤</button>
      <input type="file" id="import-file" accept=".json" hidden>
    </div>
    <div class="kbd-hint">Press <kbd>Ctrl</kbd>+<kbd>K</kbd> to search everything</div>
  </aside>
  <main class="main" id="main"><!-- views render here --></main>
</div>
<div class="cmdk-backdrop" id="cmdk" hidden>
  <div class="cmdk">
    <input id="cmdk-input" placeholder="Search clients, loans, invoices, risks… or type an action" autocomplete="off">
    <div class="cmdk-results" id="cmdk-results"></div>
  </div>
</div>
<div class="chart-tip" id="chart-tip" hidden></div>
<div class="modal-backdrop" id="modal-backdrop" hidden>
  <div class="modal" id="modal"></div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* Data layer: localStorage-backed store with seed data and helpers. */
(function () {
  const KEY = "godmode-consultant-db-v1";

  const seed = () => ({
    clients: [],
    engagements: [],
    audits: [],
    findings: [],
    accounts: [
      { id: "a-cash",  name: "Cash & Bank",          type: "Asset" },
      { id: "a-ar",    name: "Accounts Receivable",  type: "Asset" },
      { id: "a-equip", name: "Equipment",            type: "Asset" },
      { id: "l-ap",    name: "Accounts Payable",     type: "Liability" },
      { id: "l-loan",  name: "Loans Payable",        type: "Liability" },
      { id: "q-cap",   name: "Owner's Capital",      type: "Equity" },
      { id: "i-fees",  name: "Consulting Fees",      type: "Income" },
      { id: "i-int",   name: "Interest Income",      type: "Income" },
      { id: "e-rent",  name: "Rent Expense",         type: "Expense" },
      { id: "e-sal",   name: "Salaries Expense",     type: "Expense" },
      { id: "e-oth",   name: "Other Expenses",       type: "Expense" }
    ],
    journal: [],
    invoices: [],
    loans: [],
    obligations: [],
    employees: [],
    risks: [],
    ooda: [],
    settings: { currency: "USD" }
  });

  let db;
  try {
    db = JSON.parse(localStorage.getItem(KEY)) || seed();
  } catch (e) {
    db = seed();
  }
  // Backfill any collections added after first save.
  const fresh = seed();
  Object.keys(fresh).forEach(k => { if (db[k] === undefined) db[k] = fresh[k]; });

  window.DB = db;
  window.saveDB = function () { localStorage.setItem(KEY, JSON.stringify(db)); };
  window.resetDB = function () { localStorage.removeItem(KEY); location.reload(); };
  window.uid = function (p) { return (p || "id") + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); };

  window.exportDB = function () {
    const blob = new Blob([JSON.stringify(db, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "godmode-backup-" + new Date().toISOString().slice(0, 10) + ".json";
    a.click();
    URL.revokeObjectURL(a.href);
  };

  window.importDB = function (file, cb) {
    const r = new FileReader();
    r.onload = () => {
      try {
        const data = JSON.parse(r.result);
        if (typeof data !== "object" || !data.accounts) throw new Error("bad file");
        Object.keys(db).forEach(k => delete db[k]);
        Object.assign(db, seed(), data);
        saveDB();
        cb(true);
      } catch (e) { cb(false); }
    };
    r.readAsText(file);
  };
})();

/* ============================================================
   GOD MODE — Business Consultant OS
   Modules: Dashboard, OODA Engine, Consulting/CRM, Auditing,
   Accounting, Microfinance, Tax & Compliance, HR & Payroll,
   Risk Register, Financial Analysis.
   ============================================================ */

/* ---------- tiny helpers ---------- */
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const esc = s => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const money = n => {
  const cur = DB.settings.currency || "USD";
  const v = Number(n) || 0;
  return v.toLocaleString(undefined, { style: "currency", currency: cur, maximumFractionDigits: 2 });
};
const num = n => (Number(n) || 0).toLocaleString(undefined, { maximumFractionDigits: 2 });
const today = () => new Date().toISOString().slice(0, 10);
const daysUntil = d => Math.ceil((new Date(d) - new Date(today())) / 86400000);

function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(t._h);
  t._h = setTimeout(() => { t.hidden = true; }, 2600);
}

function openModal(html, onMount) {
  $("#modal").innerHTML = html;
  $("#modal-backdrop").hidden = false;
  if (onMount) onMount($("#modal"));
  const f = $("#modal input, #modal select, #modal textarea");
  if (f) f.focus();
}
function closeModal() { $("#modal-backdrop").hidden = true; $("#modal").innerHTML = ""; }
$("#modal-backdrop").addEventListener("click", e => { if (e.target.id === "modal-backdrop") closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

const clientName = id => (DB.clients.find(c => c.id === id) || {}).name || "—";
const clientOptions = sel =>
  `<option value="">— none / internal —</option>` +
  DB.clients.map(c => `<option value="${c.id}" ${c.id === sel ? "selected" : ""}>${esc(c.name)}</option>`).join("");

/* ============================================================
   ACCOUNTING computations
   ============================================================ */
function accountBalances() {
  const bal = {}; // id -> debit-credit net
  DB.accounts.forEach(a => bal[a.id] = 0);
  DB.journal.forEach(j => {
    bal[j.debit] = (bal[j.debit] || 0) + Number(j.amount);
    bal[j.credit] = (bal[j.credit] || 0) - Number(j.amount);
  });
  return bal;
}
function normalBalance(acc, raw) {
  // Assets/Expenses are debit-normal; others credit-normal.
  return (acc.type === "Asset" || acc.type === "Expense") ? raw : -raw;
}
function financials() {
  const bal = accountBalances();
  const by = t => DB.accounts.filter(a => a.type === t)
    .map(a => ({ acc: a, amt: normalBalance(a, bal[a.id] || 0) }));
  const sum = rows => rows.reduce((s, r) => s + r.amt, 0);
  const income = by("Income"), expense = by("Expense");
  const assets = by("Asset"), liabs = by("Liability"), equity = by("Equity");
  const netIncome = sum(income) - sum(expense);
  return { income, expense, assets, liabs, equity, netIncome,
    totalAssets: sum(assets), totalLiabs: sum(liabs), totalEquity: sum(equity) };
}

/* ============================================================
   MICROFINANCE computations
   ============================================================ */
function loanSchedule(loan) {
  const P = Number(loan.principal), months = Number(loan.months);
  const annual = Number(loan.rate) / 100;
  const rows = [];
  if (!P || !months) return { rows, totalInterest: 0, totalDue: P, payment: 0 };
  if (loan.method === "flat") {
    const totalInterest = P * annual * (months / 12);
    const payment = (P + totalInterest) / months;
    let balance = P + totalInterest;
    for (let m = 1; m <= months; m++) {
      balance -= payment;
      rows.push({ m, payment, principal: P / months, interest: totalInterest / months, balance: Math.max(0, balance) });
    }
    return { rows, totalInterest, totalDue: P + totalInterest, payment };
  }
  // declining balance (amortized)
  const r = annual / 12;
  const payment = r === 0 ? P / months : P * r / (1 - Math.pow(1 + r, -months));
  let bal = P, totalInterest = 0;
  for (let m = 1; m <= months; m++) {
    const interest = bal * r;
    const princ = payment - interest;
    bal = Math.max(0, bal - princ);
    totalInterest += interest;
    rows.push({ m, payment, principal: princ, interest, balance: bal });
  }
  return { rows, totalInterest, totalDue: P + totalInterest, payment };
}
const loanOutstanding = l => Math.max(0, loanSchedule(l).totalDue - (Number(l.repaid) || 0));
function portfolioStats() {
  const active = DB.loans.filter(l => l.status === "active");
  const outstanding = active.reduce((s, l) => s + loanOutstanding(l), 0);
  const par30 = active.filter(l => Number(l.daysOverdue) > 30)
    .reduce((s, l) => s + loanOutstanding(l), 0);
  return { count: active.length, outstanding, par30,
    parPct: outstanding ? (par30 / outstanding) * 100 : 0 };
}

/* ============================================================
   CASH-FLOW SERIES (monthly income vs expenses from the journal)
   ============================================================ */
function cashflowSeries(monthsBack) {
  const type = id => (DB.accounts.find(a => a.id === id) || {}).type;
  const keys = [];
  const now = new Date();
  for (let i = monthsBack - 1; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    keys.push(d.toISOString().slice(0, 7));
  }
  const inc = Object.fromEntries(keys.map(k => [k, 0]));
  const exp = Object.fromEntries(keys.map(k => [k, 0]));
  DB.journal.forEach(j => {
    const k = String(j.date).slice(0, 7);
    if (!(k in inc)) return;
    const amt = Number(j.amount);
    if (type(j.credit) === "Income") inc[k] += amt;
    if (type(j.debit) === "Income") inc[k] -= amt;
    if (type(j.debit) === "Expense") exp[k] += amt;
    if (type(j.credit) === "Expense") exp[k] -= amt;
  });
  return keys.map(k => ({
    key: k,
    label: new Date(k + "-01T00:00:00").toLocaleString(undefined, { month: "short" }),
    income: inc[k], expense: exp[k]
  }));
}

/* Validated 2-series palette for the dark surface (OKLCH band + CVD checked). */
const CHART = { income: "#b98a20", expense: "#4489c2" };

function cashflowChartHtml(series) {
  const W = 640, H = 190, padL = 8, padB = 22, padT = 12;
  const max = Math.max(1, ...series.map(s => Math.max(s.income, s.expense)));
  const plotH = H - padB - padT;
  const groupW = (W - padL * 2) / series.length;
  const barW = Math.min(26, groupW * 0.28);
  const y = v => padT + plotH * (1 - v / max);
  const bar = (x, v, color, name, m) => {
    const h = Math.max(0, plotH * (v / max));
    const top = padT + plotH - h;
    const r = Math.min(4, h);
    return `<path class="bar" d="M${x},${padT + plotH} v${-(h - r)} q0,-${r} ${r},-${r} h${barW - 2 * r} q${r},0 ${r},${r} v${h - r} z"
      fill="${color}" data-tip="${esc(m.label)} · ${esc(name)}|${esc(money(v))}"></path>`;
  };
  const grid = [0.25, 0.5, 0.75, 1].map(f =>
    `<line class="grid" x1="${padL}" x2="${W - padL}" y1="${y(max * f)}" y2="${y(max * f)}"></line>`).join("");
  const bars = series.map((m, i) => {
    const gx = padL + i * groupW + (groupW - (barW * 2 + 2)) / 2;
    return bar(gx, m.income, CHART.income, "Income", m) +
           bar(gx + barW + 2, m.expense, CHART.expense, "Expenses", m) +
           `<text class="axis-label" x="${padL + i * groupW + groupW / 2}" y="${H - 6}" text-anchor="middle">${esc(m.label)}</text>`;
  }).join("");
  return `
    <div class="chart-legend">
      <span><span class="chip" style="background:${CHART.income}"></span>Income</span>
      <span><span class="chip" style="background:${CHART.expense}"></span>Expenses</span>
    </div>
    <svg class="cashflow-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly income versus expenses">
      ${grid}
      <line class="grid" x1="${padL}" x2="${W - padL}" y1="${padT + plotH}" y2="${padT + plotH}" style="stroke:rgba(132,150,169,.5)"></line>
      ${bars}
    </svg>
    <details class="chart-data"><summary>View as table</summary>
      <div class="tbl-wrap"><table>
        <tr><th>Month</th><th class="num">Income</th><th class="num">Expenses</th><th class="num">Net</th></tr>
        ${series.map(m => `<tr><td>${esc(m.label)}</td><td class="num">${money(m.income)}</td>
          <td class="num">${money(m.expense)}</td>
          <td class="num ${m.income - m.expense >= 0 ? "pos" : "neg"}">${money(m.income - m.expense)}</td></tr>`).join("")}
      </table></div>
    </details>`;
}

/* ============================================================
   CLIENT 360° HEALTH
   ============================================================ */
function clientHealth(cid) {
  let score = 100;
  const notes = [];
  const findings = DB.findings.filter(f => {
    const a = DB.audits.find(x => x.id === f.auditId);
    return a && a.clientId === cid && f.status === "open";
  });
  const severe = findings.filter(f => f.severity === "critical" || f.severity === "high").length;
  const fPenalty = Math.min(30, severe * 10 + (findings.length - severe) * 3);
  if (fPenalty) { score -= fPenalty; notes.push(findings.length + " open audit finding(s), " + severe + " severe"); }

  const invs = DB.invoices.filter(i => i.clientId === cid);
  const od = invs.filter(invOverdue);
  if (od.length) { score -= 15; notes.push(od.length + " overdue invoice(s) — " + money(od.reduce((s, i) => s + invTotal(i), 0))); }

  const obl = DB.obligations.filter(o => o.clientId === cid && o.status === "pending" && daysUntil(o.dueDate) < 0);
  if (obl.length) { score -= 10; notes.push(obl.length + " compliance deadline(s) missed"); }

  const risks = DB.risks.filter(r => r.status === "open" && r.likelihood * r.impact >= 15);
  if (risks.length) { score -= Math.min(15, risks.length * 5); notes.push(risks.length + " severe open risk(s) on the register"); }

  score = Math.max(0, score);
  const grade = score >= 85 ? "A" : score >= 70 ? "B" : score >= 55 ? "C" : score >= 40 ? "D" : "E";
  return { score, grade, notes, findings, invs };
}

function oodaAdvance(o) {
  if (o.stage < 3) { o.stage++; }
  else {
    // full cycle completed — archive notes, restart at Observe
    o.log.push({ cycle: o.cycles + 1, at: today(), notes: { ...o.notes } });
    o.cycles++;
    o.stage = 0;
    o.notes = { observe: "", orient: "", decide: "", act: "" };
    toast("Cycle " + o.cycles + " archived — loop restarts at Observe.");
  }
  saveDB(); render();
}

function formModal(title, bodyHtml, onSubmit, submitLabel) {
  openModal(`
    <h2>${title}</h2>
    <form id="modal-form">${bodyHtml}
      <div class="modal-actions">
        <button type="button" class="btn" data-action="modal-close">Cancel</button>
        <button type="submit" class="btn btn-primary">${submitLabel || "Save"}</button>
      </div>
    </form>`, m => {
    $("#modal-form", m).addEventListener("submit", e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const data = {};
      fd.forEach((v, k) => data[k] = typeof v === "string" ? v.trim() : v);
      if (onSubmit(data) !== false) { closeModal(); saveDB(); render(); }
    });
  });
}

/* ============================================================
   ANALYSIS calculators (inline, non-persistent)
   ============================================================ */
function bindAnalysis() {
  const g = (fd, k) => Number(fd.get(k)) || 0;
  const line = (l, v, note) => `<div class="report-line"><span>${l}${note ? ` <span class="muted">(${note})</span>` : ""}</span><span class="amt">${v}</span></div>`;

  const fr = $("#f-ratios");
  if (fr) fr.addEventListener("submit", e => {
    e.preventDefault();
    const fd = new FormData(fr);
    const ca = g(fd, "ca"), cl = g(fd, "cl"), inv = g(fd, "inv"), debt = g(fd, "debt"),
      eq = g(fd, "eq"), ta = g(fd, "ta"), rev = g(fd, "rev"), ni = g(fd, "ni");
    const r = (a, b) => b ? num(a / b) : "—";
    const pct = (a, b) => b ? num(a / b * 100) + "%" : "—";
    $("#out-ratios").innerHTML =
      line("Current ratio", r(ca, cl), "≥ 1.5 healthy") +
      line("Quick ratio", r(ca - inv, cl), "≥ 1.0 healthy") +
      line("Debt-to-equity", r(debt, eq), "< 2.0 typical") +
      line("Net margin", pct(ni, rev)) +
      line("Return on assets", pct(ni, ta)) +
      line("Return on equity", pct(ni, eq));
  });

  const fb = $("#f-be");
  if (fb) fb.addEventListener("submit", e => {
    e.preventDefault();
    const fd = new FormData(fb);
    const fc = g(fd, "fc"), p = g(fd, "p"), vc = g(fd, "vc");
    const cm = p - vc;
    $("#out-be").innerHTML = cm > 0
      ? line("Contribution margin / unit", money(cm)) +
        line("Break-even units", num(Math.ceil(fc / cm))) +
        line("Break-even revenue", money(Math.ceil(fc / cm) * p)) +
        line("CM ratio", num(cm / p * 100) + "%")
      : `<div class="muted">Price must exceed variable cost per unit.</div>`;
  });

  const fn = $("#f-npv");
  if (fn) fn.addEventListener("submit", e => {
    e.preventDefault();
    const fd = new FormData(fn);
    const rate = g(fd, "rate") / 100, inv = g(fd, "inv");
    const cfs = String(fd.get("cf") || "").split(",").map(s => s.trim()).filter(Boolean)
      .map(Number).filter(x => !isNaN(x));
    let npv = -inv, cum = -inv, payback = null;
    cfs.forEach((cf, i) => {
      npv += cf / Math.pow(1 + rate, i + 1);
      const prev = cum;
      cum += cf;
      if (payback === null && cum >= 0 && cf > 0) payback = i + (prev < 0 ? (-prev / cf) : 0);
    });
    $("#out-npv").innerHTML =
      line("NPV", money(npv)) +
      line("Verdict", npv > 0 ? `<span class="pos">Accept — value creating</span>` : `<span class="neg">Reject — value destroying</span>`) +
      line("Simple payback", payback !== null ? num(payback) + " periods" : "not recovered");
  });

  const fdcf = $("#f-dcf");
  if (fdcf) fdcf.addEventListener("submit", e => {
    e.preventDefault();
    const fd = new FormData(fdcf);
    const fcf = g(fd, "fcf"), gr = g(fd, "g") / 100, tg = g(fd, "tg") / 100, r = g(fd, "r") / 100;
    if (r <= tg) { $("#out-dcf").innerHTML = `<div class="neg">Discount rate must exceed terminal growth.</div>`; return; }
    let ev = 0, cf = fcf;
    for (let t = 1; t <= 5; t++) { cf = cf * (1 + gr); ev += cf / Math.pow(1 + r, t); }
    const tv = (cf * (1 + tg)) / (r - tg) / Math.pow(1 + r, 5);
    $("#out-dcf").innerHTML =
      line("PV of 5-year cash flows", money(ev)) +
      line("PV of terminal value", money(tv)) +
      line("<strong>Enterprise value</strong>", `<strong>${money(ev + tv)}</strong>`) +
      line("Conservative (−25%)", money((ev + tv) * 0.75), "negotiation floor");
  });

  const fm = $("#f-mult");
  if (fm) fm.addEventListener("submit", e => {
    e.preventDefault();
    const fd = new FormData(fm);
    const eb = g(fd, "ebitda"), m = g(fd, "mult");
    $("#out-mult").innerHTML =
      line("Low (×" + num(Math.max(1, m - 1)) + ")", money(eb * Math.max(1, m - 1))) +
      line("Mid (×" + num(m) + ")", money(eb * m)) +
      line("High (×" + num(m + 1) + ")", money(eb * (m + 1)));
  });
}

/* ============================================================
   ROUTER / EVENTS
   ============================================================ */
let currentView = "dashboard";

function render() {
  $("#main").innerHTML = views[currentView]();
  $$("#nav a").forEach(a => a.classList.toggle("active", a.dataset.view === currentView));
  if (currentView === "analysis") bindAnalysis();
  window.scrollTo(0, 0);
}

function nav(v) { currentView = v; render(); }

document.addEventListener("click", e => {
  const el = e.target.closest("[data-action], #nav a");
  if (!el) return;

  if (el.matches("#nav a")) { nav(el.dataset.view); return; }

  const act = el.dataset.action, id = el.dataset.id;
  const del = (arr, msg) => {
    const i = arr.findIndex(x => x.id === id);
    if (i > -1 && confirm("Delete this item?")) { arr.splice(i, 1); saveDB(); render(); toast(msg); }
  };

  switch (act) {
    case "nav": nav(el.dataset.view); break;
    case "modal-close": closeModal(); break;
    case "export-data": exportDB(); toast("Backup downloaded."); break;
    case "import-data": $("#import-file").click(); break;

    case "client-new": case "client-swot": case "client-360": case "eng-new":
    case "audit-new": case "finding-new": case "account-new": case "journal-new":
    case "loan-new": case "loan-pay": case "loan-sched": case "obl-new":
    case "emp-new": case "risk-new": case "ooda-new": case "ooda-note":
    case "inv-new": case "inv-view": case "currency":
      forms[act](id); break;

    case "inv-send": {
      const i = DB.invoices.find(x => x.id === id);
      i.status = "sent"; saveDB(); render(); toast(i.number + " marked as sent."); break;
    }
    case "inv-paid": {
      const i = DB.invoices.find(x => x.id === id);
      i.status = "paid"; i.paidDate = today();
      const cash = DB.accounts.find(a => a.id === "a-cash") || DB.accounts.find(a => a.type === "Asset");
      const fees = DB.accounts.find(a => a.id === "i-fees") || DB.accounts.find(a => a.type === "Income");
      if (cash && fees) {
        DB.journal.push({ id: uid("je"), date: today(), amount: invTotal(i),
          debit: cash.id, credit: fees.id, memo: i.number + " — " + clientName(i.clientId) });
        toast(i.number + " paid — posted to the books.");
      } else toast(i.number + " marked paid.");
      saveDB(); render(); break;
    }
    case "inv-del": del(DB.invoices, "Invoice removed."); break;

    case "client-del": {
      const hasDeps = DB.engagements.some(x => x.clientId === id) || DB.audits.some(x => x.clientId === id);
      if (hasDeps && !confirm("This client has engagements/audits attached. Delete anyway?")) break;
      const i = DB.clients.findIndex(x => x.id === id);
      if (i > -1) { DB.clients.splice(i, 1); saveDB(); render(); toast("Client removed."); }
      break;
    }
    case "eng-del": del(DB.engagements, "Engagement removed."); break;
    case "eng-next": {
      const g = DB.engagements.find(x => x.id === id);
      g.status = g.status === "proposal" ? "active" : "completed";
      saveDB(); render(); break;
    }
    case "audit-del": del(DB.audits, "Audit removed."); break;
    case "audit-next": {
      const a = DB.audits.find(x => x.id === id);
      a.status = AUDIT_STAGES[Math.min(AUDIT_STAGES.indexOf(a.status) + 1, 3)];
      saveDB(); render(); break;
    }
    case "finding-del": del(DB.findings, "Finding removed."); break;
    case "finding-resolve": {
      const f = DB.findings.find(x => x.id === id);
      f.status = "resolved"; saveDB(); render(); toast("Finding resolved."); break;
    }
    case "journal-del": del(DB.journal, "Entry removed."); break;
    case "loan-del": del(DB.loans, "Loan removed."); break;
    case "obl-del": del(DB.obligations, "Obligation removed."); break;
    case "obl-file": {
      const o = DB.obligations.find(x => x.id === id);
      o.status = "filed"; saveDB(); render(); toast("Marked as filed."); break;
    }
    case "emp-del": del(DB.employees, "Employee removed."); break;
    case "risk-del": del(DB.risks, "Risk removed."); break;
    case "risk-close": {
      const r = DB.risks.find(x => x.id === id);
      r.status = "mitigated"; saveDB(); render(); toast("Risk mitigated."); break;
    }
    case "ooda-del": del(DB.ooda, "Loop removed."); break;
    case "ooda-skip": oodaAdvance(DB.ooda.find(x => x.id === id)); break;
    case "ooda-done": {
      const o = DB.ooda.find(x => x.id === id);
      o.status = "done"; saveDB(); render(); toast("Loop completed."); break;
    }
  }
});

    [["dashboard", "Dashboard"], ["ooda", "OODA Engine"], ["consulting", "Consulting / CRM"],
     ["auditing", "Auditing"], ["accounting", "Accounting"], ["invoicing", "Invoicing"],
     ["microfinance", "Microfinance"], ["tax", "Tax & Compliance"], ["hr", "HR & Payroll"],
     ["risk", "Risk Register"], ["analysis", "Financial Analysis"]]
      .forEach(([v, l]) => add("go to", l, "", () => nav(v)));
    [["client-new", "New client"], ["eng-new", "New engagement"], ["inv-new", "New invoice"],
     ["journal-new", "New journal entry"], ["loan-new", "New loan"], ["audit-new", "New audit"],
     ["finding-new", "New finding"], ["risk-new", "New risk"], ["obl-new", "New obligation"],
     ["emp-new", "New employee"], ["ooda-new", "New OODA loop"], ["currency", "Change currency"]]
      .forEach(([a, l]) => add("action", l, "", () => forms[a]()));
    DB.clients.forEach(c => add("client", c.name, c.industry || "", () => { nav("consulting"); forms["client-360"](c.id); }));
    DB.invoices.forEach(i => add("invoice", i.number + " · " + clientName(i.clientId), money(invTotal(i)), () => { nav("invoicing"); forms["inv-view"](i.id); }));
    DB.loans.forEach(l => add("loan", l.borrower, money(loanOutstanding(l)) + " outstanding", () => nav("microfinance")));
    DB.findings.forEach(f => add("finding", f.title, f.severity, () => nav("auditing")));
    DB.risks.forEach(r => add("risk", r.title, "score " + r.likelihood * r.impact, () => nav("risk")));
    DB.obligations.forEach(o => add("deadline", o.name, "due " + o.dueDate, () => nav("tax")));
    DB.employees.forEach(e2 => add("employee", e2.name, e2.role || "", () => nav("hr")));
    DB.ooda.forEach(o => add("ooda", o.title, o.status === "active" ? "stage: " + OODA_STAGES[o.stage] : "done", () => nav("ooda")));
    return ix;
  },

  show() {
    this.open = true; this.sel = 0;
    $("#cmdk").hidden = false;
    const inp = $("#cmdk-input");
    inp.value = ""; inp.focus();
    this.filter("");
  },
  hide() { this.open = false; $("#cmdk").hidden = true; },

  filter(q) {
    const all = this.index();
    q = q.toLowerCase().trim();
    this.results = q
      ? all.filter(x => (x.label + " " + x.tag + " " + x.sub).toLowerCase().includes(q)).slice(0, 12)
      : all.slice(0, 12);
    this.sel = 0;
    this.paint();
  },
  paint() {
    $("#cmdk-results").innerHTML = this.results.length
      ? this.results.map((r, i) => `<div class="cmdk-item ${i === this.sel ? "sel" : ""}" data-i="${i}">
          <span class="tag">${esc(r.tag)}</span><span>${esc(r.label)}</span><span class="sub">${esc(r.sub)}</span></div>`).join("")
      : `<div class="cmdk-empty">Nothing matches. Try a client, invoice number or "new".</div>`;
  },
  pick(i) {
    const r = this.results[i];
    if (!r) return;
    this.hide();
    r.run();
  }
};

document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); cmdk.open ? cmdk.hide() : cmdk.show(); return; }
  if (!cmdk.open) return;
  if (e.key === "Escape") { cmdk.hide(); return; }
  if (e.key === "ArrowDown") { e.preventDefault(); cmdk.sel = Math.min(cmdk.sel + 1, cmdk.results.length - 1); cmdk.paint(); }
  if (e.key === "ArrowUp") { e.preventDefault(); cmdk.sel = Math.max(cmdk.sel - 1, 0); cmdk.paint(); }
  if (e.key === "Enter") { e.preventDefault(); cmdk.pick(cmdk.sel); }
});
$("#cmdk-input").addEventListener("input", e => cmdk.filter(e.target.value));
$("#cmdk").addEventListener("click", e => {
  if (e.target.id === "cmdk") { cmdk.hide(); return; }
  const item = e.target.closest(".cmdk-item");
  if (item) cmdk.pick(Number(item.dataset.i));
});

$("#import-file").addEventListener("change", e => {
  const f = e.target.files[0];
  if (f) importDB(f, ok => {
    toast(ok ? "Data imported." : "Import failed — invalid file.");
    if (ok) render();
  });
  e.target.value = "";
});

render();

</script>
</body>
</html>
